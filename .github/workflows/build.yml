name: Build Android APK

# Kapan workflow ini akan berjalan?
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan kamu menjalankan build secara manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout kode dari repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup Java (Gradle versi baru butuh JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle # Mempercepat build berikutnya dengan menyimpan cache Gradle

    # 3. Beri izin eksekusi untuk file gradlew
    - name: Grant Execute Permission for gradlew
      run: chmod +x gradlew

    # 4. Lakukan Build APK versi Debug
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 5. Upload APK agar bisa diunduh dari GitHub
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    # =========================================================================
    # OPSIONAL: Build versi Release (Hapus tanda '#' di bawah jika sudah siap)
    # Kamu harus mengatur "signingConfig" di build.gradle.kts terlebih dahulu
    # dan menyimpan file keystore sebagai GitHub Secrets.
    # =========================================================================
    # - name: Build Release APK
    #   run: ./gradlew assembleRelease
    #
    # - name: Upload Release APK
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: app-release
    #     path: app/build/outputs/apk/release/app-release.apk
